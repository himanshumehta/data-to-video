<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="file://{{ templates_abs_dir }}/_base.css">
  <style>
    html, body { width: {{ width }}px; height: {{ height }}px; overflow: hidden; }
    .cta-bike {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .cta-bike img {
      max-width: 90%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 40px rgba(255,255,255,0.05));
    }
    .cta-text {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      color: var(--text-2);
      line-height: 1.3;
      padding: 0 48px;
      margin-bottom: 16px;
    }
    .cta-text span {
      color: var(--color-amber);
      font-weight: 800;
    }
    .cta-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .cta-logo .brand-logo {
      font-size: 56px;
      display: inline-block;
    }
    .cta-url {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: var(--color-amber);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .swipe-hint {
      text-align: center;
      font-size: 18px;
      color: var(--text-3);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="slide-bg"><div class="glow"></div></div>

  <div class="slide-header">
    {% include '_shared/brand-logo.html' %}
    <div class="slide-counter">
      <span class="current">{{ slide_number }}</span><span class="total">/{{ total_slides }}</span>
    </div>
  </div>

  <div class="slide-content" style="align-items: center;">
    <div class="cta-bike">
      <img src="{{ vehicle.primary_nobg_url }}" alt="{{ vehicle.short_name }}">
    </div>

    <div class="cta-text">
      Full <span>20-year breakdown</span> on bikencars.com
    </div>

    <div class="cta-logo">
      {% include '_shared/brand-logo.html' %}
    </div>

    <div class="cta-url">bikencars.com</div>
    <div class="swipe-hint">Swipe up for full report</div>
  </div>

  {% include '_shared/progress-dots.html' %}
  {% include '_shared/watermark.html' %}
</div>
</body>
</html>
