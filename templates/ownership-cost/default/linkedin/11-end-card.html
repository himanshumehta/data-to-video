<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="file://{{ templates_abs_dir }}/_base.css">
  <style>
    html, body { width: {{ width }}px; height: {{ height }}px; overflow: hidden; }

    .slide { align-items: center; justify-content: center; }

    .bg-glow-brand {
      position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
      width: 650px; height: 480px;
      background: radial-gradient(ellipse, rgba(71,131,255,0.05) 0%, transparent 60%);
      pointer-events: none; z-index: 1;
    }
    .bg-glow-emerald {
      position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
      width: 580px; height: 320px;
      background: radial-gradient(ellipse, rgba(16,185,129,0.035) 0%, transparent 60%);
      pointer-events: none; z-index: 1;
    }
    .edge-light {
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent 5%, rgba(71,131,255,0.15) 30%, rgba(71,131,255,0.25) 50%, rgba(71,131,255,0.15) 70%, transparent 95%);
      z-index: 20;
    }
    .bg-lines {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(255,255,255,0.012) 59px, rgba(255,255,255,0.012) 60px);
      pointer-events: none; z-index: 1;
    }

    .end-content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
    }

    /* Large brand logo */
    .logo-area { margin-bottom: 36px; }
    .logo-area .brand-logo {
      font-size: 56px; font-weight: 800; letter-spacing: -2px;
    }
    .logo-area .brand-logo .b { color: #4783ff; }
    .logo-area .brand-logo .n {
      color: #fff; display: inline-block; transform: rotate(-12deg);
      text-shadow: 0 0 30px rgba(255,255,255,0.4); font-style: italic;
    }
    .logo-area .brand-logo .c { color: #f43f5e; }

    /* CTA text */
    .cta-primary {
      font-size: 34px; font-weight: 900;
      color: #10B981;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      text-shadow: 0 0 40px rgba(16,185,129,0.15);
    }
    .cta-secondary {
      font-size: 20px; font-weight: 600;
      color: var(--text-3); line-height: 1.4;
      margin-bottom: 36px;
    }

    .divider {
      width: 240px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(71,131,255,0.2), transparent);
      margin-bottom: 36px;
    }

    /* Domain */
    .domain {
      font-size: 28px; font-weight: 900;
      letter-spacing: 0.04em; margin-bottom: 22px;
    }
    .domain .bike { color: #4783ff; }
    .domain .n-char {
      color: #fff; display: inline-block; transform: rotate(-12deg);
      text-shadow: 0 0 20px rgba(255,255,255,0.5); font-style: italic;
    }
    .domain .cars { color: #f43f5e; }
    .domain .tld { color: var(--text-4); }

    /* Social handles */
    .social-row {
      display: flex; gap: 14px; align-items: center;
    }
    .social-handle {
      padding: 11px 24px; border-radius: 50px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 18px; font-weight: 700;
      color: var(--text-3); letter-spacing: 0.02em;
    }
    .social-handle .at { color: #4783ff; font-weight: 800; }
  </style>
</head>
<body>
<div class="slide">
  <div class="bg-glow-brand"></div>
  <div class="bg-glow-emerald"></div>
  <div class="edge-light"></div>
  <div class="bg-lines"></div>

  <div class="end-content">
    <div class="logo-area">
      <div class="brand-logo"><span class="b">Bike</span><span class="n">N</span><span class="c">Cars</span></div>
    </div>

    <div class="cta-primary">Like, Save & Share</div>
    <div class="cta-secondary">Drop your real monthly expense below</div>

    <div class="divider"></div>

    <div class="domain">
      <span class="bike">bike</span><span class="n-char">n</span><span class="cars">cars</span><span class="tld">.com</span>
    </div>

    <div class="social-row">
      <div class="social-handle"><span class="at">@</span>bikencars_official</div>
    </div>
  </div>

  {% include '_shared/progress-dots.html' %}
  {% include '_shared/watermark.html' %}
</div>
</body>
</html>
