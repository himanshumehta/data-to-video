<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width={{ width }}, initial-scale=1.0">
<title>{{ vehicle.brand_name }} {{ vehicle.short_name }} — Cons</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="file://{{ templates_abs_dir }}/_base.css">
<style>
  html, body { width: {{ width }}px; height: {{ height }}px; overflow: hidden; }

  .cons-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
</style>
</head>
<body>
<div class="slide" style="background: var(--surface-1);">
  <div class="slide-bg"><div class="glow"></div></div>

  <div class="slide-header">
    {% include '_shared/brand-logo.html' %}
    <div class="slide-counter">
      <span class="current">{{ slide_number }}</span>
      <span class="total">/ {{ total_slides }}</span>
    </div>
  </div>

  <div class="slide-content">
    <div class="section-label" style="color: var(--color-red);">✗ Watch Out For</div>

    <div class="cons-list">
      {% for con in vehicle.cons[:5] %}
      <div class="pro-item">
        <div class="pro-dot red"></div>
        <div class="pro-text"><strong>{{ con.title }}</strong> — {{ con.description }}</div>
      </div>
      {% endfor %}
    </div>
  </div>

  {% include '_shared/progress-dots.html' %}
  {% include '_shared/watermark.html' %}
</div>
</body>
</html>
