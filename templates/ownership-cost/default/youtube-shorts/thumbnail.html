<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { width: {{ width }}px; height: {{ height }}px; font-family: 'Inter', sans-serif; }

    .slide {
      width: {{ width }}px; height: {{ height }}px;
      position: relative; overflow: hidden;
      background: #08080a;
    }

    /* Subtle blue glow top-left */
    .glow-left {
      position: absolute; top: 10%; left: -10%;
      width: 3600px; height: 3600px;
      background: radial-gradient(ellipse, rgba(71,131,255,0.05) 0%, transparent 60%);
      pointer-events: none;
    }
    /* Amber glow behind bike */
    .glow-bike {
      position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
      width: 4200px; height: 4200px;
      background: radial-gradient(ellipse, rgba(245,158,11,0.06) 0%, transparent 55%);
      pointer-events: none;
    }

    /* Logo — top center */
    .logo {
      position: absolute; top: 160px; left: 50%; transform: translateX(-50%);
      z-index: 20;
      font-size: 140px; font-weight: 800; letter-spacing: -2px;
      white-space: nowrap;
    }
    .logo .b { color: #4783ff; }
    .logo .n { color: #fff; display: inline-block; transform: rotate(-12deg);
                font-style: italic; text-shadow: 0 0 60px rgba(255,255,255,0.4); }
    .logo .c { color: #f43f5e; }

    /* Bike — upper half, centered */
    .bike-wrap {
      position: absolute;
      top: 8%;
      left: 50%; transform: translateX(-50%);
      width: 95%;
      z-index: 2;
    }
    .bike-wrap img {
      width: 100%; height: auto;
      display: block;
      filter: drop-shadow(0 80px 240px rgba(0,0,0,0.7))
              drop-shadow(0 0 200px rgba(245,158,11,0.08));
    }

    /* Gradient fade from bottom over bike */
    .bottom-fade {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 65%;
      background: linear-gradient(to top, #08080a 45%, transparent 100%);
      z-index: 3;
      pointer-events: none;
    }

    /* Title block — lower half */
    .title-block {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 52%;
      z-index: 10;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 0 200px 400px 200px;
    }
    .line1 {
      font-size: 520px;
      font-weight: 900;
      line-height: 0.92;
      color: #f4f4f5;
      letter-spacing: -6px;
      text-transform: uppercase;
    }
    .line2 {
      font-size: 520px;
      font-weight: 900;
      line-height: 0.92;
      color: #f59e0b;
      letter-spacing: -6px;
      text-transform: uppercase;
    }

    /* Watermark */
    .watermark {
      position: absolute; bottom: 120px; right: 160px;
      font-size: 64px; font-weight: 600; letter-spacing: 0.1em;
      color: rgba(255,255,255,0.18); z-index: 20;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="glow-left"></div>
  <div class="glow-bike"></div>

  <div class="logo"><span class="b">Bike</span><span class="n">N</span><span class="c">Cars</span></div>

  {% if vehicle.primary_nobg_url %}
  <div class="bike-wrap">
    <img src="{{ vehicle.primary_nobg_url }}" alt="{{ vehicle.brand_name }} {{ vehicle.short_name }}">
  </div>
  {% endif %}

  <div class="bottom-fade"></div>

  <div class="title-block">
    <div class="line1">{{ vehicle.brand_name }}<br>{{ vehicle.short_name }}</div>
    <div class="line2">Ownership<br>Cost</div>
  </div>

  <div class="watermark">bikencars.com</div>
</div>
</body>
</html>
