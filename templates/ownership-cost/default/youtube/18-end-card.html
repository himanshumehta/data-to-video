<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { width: {{ width }}px; height: {{ height }}px; font-family: 'Inter', sans-serif; transform-origin: top left; }

    .slide {
      width: {{ width }}px; height: {{ height }}px;
      position: relative; overflow: hidden;
      background: #08080a; color: #f4f4f5;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    /* Radial glows */
    .glow-brand {
      position: absolute; top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      width: 5000px; height: 3000px;
      background: radial-gradient(ellipse, rgba(71,131,255,0.05) 0%, transparent 55%);
      pointer-events: none; z-index: 1;
    }
    .glow-emerald {
      position: absolute; bottom: 10%; left: 50%;
      transform: translateX(-50%);
      width: 4000px; height: 2400px;
      background: radial-gradient(ellipse, rgba(16,185,129,0.035) 0%, transparent 60%);
      pointer-events: none; z-index: 1;
    }
    .glow-3 { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 5000px; height: 3000px; background: radial-gradient(ellipse, rgba(255,255,255,0.008) 0%, transparent 50%); pointer-events: none; z-index: 1; }
    .edge-light { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent 5%, rgba(71,131,255,0.15) 30%, rgba(71,131,255,0.25) 50%, rgba(71,131,255,0.15) 70%, transparent 95%); z-index: 20; }

    /* Subtle horizontal lines for texture */
    .bg-lines {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 119px,
        rgba(255,255,255,0.012) 119px,
        rgba(255,255,255,0.012) 120px
      );
      pointer-events: none; z-index: 1;
    }

    /* Center content */
    .end-content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Large brand logo */
    .logo-area {
      margin-bottom: 120px;
    }
    .logo-area .brand-logo {
      font-size: 280px; font-weight: 800;
      letter-spacing: -6px;
    }
    .logo-area .brand-logo .b { color: #4783ff; }
    .logo-area .brand-logo .n { color: #fff; display: inline-block; transform: rotate(-12deg); text-shadow: 0 0 80px rgba(255,255,255,0.4); font-style: italic; }
    .logo-area .brand-logo .c { color: #f43f5e; }

    /* CTA text */
    .cta-primary {
      font-size: 148px; font-weight: 900;
      color: #10B981;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 48px;
      text-shadow: 0 0 120px rgba(16,185,129,0.15);
    }

    .cta-secondary {
      font-size: 96px; font-weight: 600;
      color: #71717a;
      line-height: 1.4;
      margin-bottom: 140px;
    }

    .divider {
      width: 800px; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(71,131,255,0.2), transparent);
      margin-bottom: 140px;
    }

    /* Domain */
    .domain {
      font-size: 120px; font-weight: 900;
      letter-spacing: 0.04em;
      margin-bottom: 80px;
    }
    .domain .bike { color: #4783ff; }
    .domain .n-char { color: #fff; display: inline-block; transform: rotate(-12deg); text-shadow: 0 0 40px rgba(255,255,255,0.5); font-style: italic; }
    .domain .cars { color: #f43f5e; }
    .domain .tld { color: #71717a; }

    /* Social handles row */
    .social-row {
      display: flex; gap: 60px;
      align-items: center;
    }
    .social-handle {
      padding: 40px 80px;
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      border: 3px solid rgba(255,255,255,0.08);
      font-size: 72px; font-weight: 700;
      color: #71717a;
      letter-spacing: 0.02em;
    }
    .social-handle .at {
      color: #4783ff;
      font-weight: 800;
    }

    .watermark { position: absolute; bottom: 48px; right: 72px; font-size: 42px; color: rgba(255,255,255,0.15); font-weight: 600; letter-spacing: 0.1em; z-index: 10; }
  </style>
</head>
<body>
<div class="slide">
  <div class="glow-brand"></div><div class="glow-emerald"></div><div class="glow-3"></div><div class="edge-light"></div>
  <div class="bg-lines"></div>

  <div class="end-content">
    <div class="logo-area">
      <div class="brand-logo"><span class="b">Bike</span><span class="n">N</span><span class="c">Cars</span></div>
    </div>

    <div class="cta-primary">Like, Subscribe & Share</div>
    <div class="cta-secondary">Comment your real monthly expense below</div>

    <div class="divider"></div>

    <div class="domain">
      <span class="bike">bike</span><span class="n-char">n</span><span class="cars">cars</span><span class="tld">.com</span>
    </div>

    <div class="social-row">
      <div class="social-handle"><span class="at">@</span>bikencars_official</div>
    </div>
  </div>

  <div class="watermark">bikencars.com</div>
</div>
</body>
</html>
